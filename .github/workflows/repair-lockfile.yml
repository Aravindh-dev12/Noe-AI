name: repair-lockfile

on:
  push:
    branches:
      - research/decision-frontier-20260913
    paths:
      - .github/workflows/repair-lockfile.yml
      - packages/db/package.json
      - pnpm-lock.yaml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'ci: regenerate stale workspace lockfile')
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/decision-frontier-20260913

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit deterministic lockfile repair
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches package manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build: synchronize pnpm lockfile'
          git push origin HEAD:research/decision-frontier-20260913
