name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onbae
          POSTGRES_PASSWORD: onbae
          POSTGRES_DB: onbae
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onbae -d onbae"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://onbae:onbae@localhost:5432/onbae?schema=public
      REDIS_URL: redis://localhost:6379
      ADMIN_API_KEY: ci-only-admin-key-with-more-than-32-characters
      EVENT_SIGNING_SECRET: ci-only-event-secret-with-more-than-32-characters
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
      ONBAE_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - name: Generate reproducibility artifacts
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp pnpm-lock.yaml build-artifacts/pnpm-lock.yaml
          pnpm --filter @onbae/db exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > build-artifacts/000000000000_init.sql
      - name: Bootstrap lockfile and migration onto PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          cp build-artifacts/pnpm-lock.yaml pnpm-lock.yaml
          mkdir -p packages/db/prisma/migrations/000000000000_init
          cp build-artifacts/000000000000_init.sql packages/db/prisma/migrations/000000000000_init/migration.sql
          cat >> packages/db/prisma/migrations/000000000000_init/migration.sql <<'SQL'

          -- Onbae integrity constraints not representable in Prisma schema syntax.
          CREATE UNIQUE INDEX "ActorExecution_one_active_per_actor_key"
            ON "ActorExecution"("actorId")
            WHERE "endedAt" IS NULL;

          CREATE UNIQUE INDEX "LineageNode_one_canonical_per_actor_key"
            ON "LineageNode"("actorId")
            WHERE "canonical" = true;
          SQL
          printf 'provider = "postgresql"\n' > packages/db/prisma/migrations/migration_lock.toml

          git add pnpm-lock.yaml packages/db/prisma/migrations
          if git diff --cached --quiet; then
            echo "Reproducibility files are already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit lockfile and initial migration"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-artifacts
          path: build-artifacts
          if-no-files-found: error
      - run: pnpm db:generate
      - run: pnpm db:push
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - run: pnpm test
      - run: pnpm build
