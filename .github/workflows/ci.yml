name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onbae
          POSTGRES_PASSWORD: onbae
          POSTGRES_DB: onbae
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onbae -d onbae"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://onbae:onbae@localhost:5432/onbae?schema=public
      REDIS_URL: redis://localhost:6379
      ADMIN_API_KEY: ci-only-admin-key-with-more-than-32-characters
      EVENT_SIGNING_SECRET: ci-only-event-secret-with-more-than-32-characters
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-more-than-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
      USER_MODEL_ALLOWLIST: mock:nova-seed-v1,mock:echo-seed-v1
      MAX_USER_ACTORS: 10
      ONBAE_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_PORT: 4000
      WORKER_CONCURRENCY: 2

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply committed database migrations
        run: pnpm db:migrate

      - name: Verify migration state
        run: pnpm db:migrate:status

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate smoke-test shell
        run: bash -n scripts/ci-smoke.sh

      - name: Authenticated ownership and runtime smoke test
        shell: bash
        run: bash scripts/ci-smoke.sh
