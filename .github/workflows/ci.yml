name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onbae
          POSTGRES_PASSWORD: onbae
          POSTGRES_DB: onbae
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onbae -d onbae"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://onbae:onbae@localhost:5432/onbae?schema=public
      REDIS_URL: redis://localhost:6379
      EVENT_SIGNING_SECRET: ci-only-event-secret-with-more-than-32-characters
      ONBAE_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
