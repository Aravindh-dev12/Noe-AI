name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onbae
          POSTGRES_PASSWORD: onbae
          POSTGRES_DB: onbae
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onbae -d onbae"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://onbae:onbae@localhost:5432/onbae?schema=public
      REDIS_URL: redis://localhost:6379
      ADMIN_API_KEY: ci-only-admin-key-with-more-than-32-characters
      EVENT_SIGNING_SECRET: ci-only-event-secret-with-more-than-32-characters
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-more-than-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
      USER_MODEL_ALLOWLIST: mock:nova-seed-v1,mock:echo-seed-v1
      MAX_USER_ACTORS: 10
      ONBAE_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_PORT: 4000
      WORKER_CONCURRENCY: 2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply committed database migrations
        run: pnpm db:migrate
      - name: Verify migration state
        run: pnpm db:migrate:status
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Authenticated ownership and runtime smoke test
        shell: bash
        run: |
          set -euo pipefail

          api_log=/tmp/onbae-api.log
          worker_log=/tmp/onbae-worker.log
          web_log=/tmp/onbae-web.log
          api_pid=""
          worker_pid=""
          web_pid=""
          owner_cookies=/tmp/onbae-owner.cookies
          stranger_cookies=/tmp/onbae-stranger.cookies
          origin=http://localhost:3000
          api=http://localhost:4000

          cleanup() {
            for pid in "${web_pid:-}" "${worker_pid:-}" "${api_pid:-}"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            for pid in "${web_pid:-}" "${worker_pid:-}" "${api_pid:-}"; do
              if [ -n "$pid" ]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
          }

          diagnostics() {
            echo "--- API log ---"
            cat "$api_log" 2>/dev/null || true
            echo "--- Worker log ---"
            cat "$worker_log" 2>/dev/null || true
            echo "--- Web log ---"
            cat "$web_log" 2>/dev/null || true
          }

          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then diagnostics; fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT

          wait_for_url() {
            url=$1
            for _ in $(seq 1 50); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }

          poll_match() {
            match_id=$1
            match_status=""
            for _ in $(seq 1 50); do
              match_json=$(curl --fail --silent --show-error "$api/v1/matches/${match_id}")
              match_status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$match_json")
              if [ "$match_status" = "COMPLETED" ]; then return 0; fi
              if [ "$match_status" = "FAILED" ] || [ "$match_status" = "CANCELLED" ]; then
                echo "Match ${match_id} ended with status ${match_status}" >&2
                echo "$match_json" >&2
                return 1
              fi
              sleep 1
            done
            echo "Match ${match_id} did not complete in time" >&2
            return 1
          }

          pnpm db:seed

          NODE_ENV=production pnpm --filter @onbae/api start >"$api_log" 2>&1 &
          api_pid=$!
          NODE_ENV=production pnpm --filter @onbae/worker start >"$worker_log" 2>&1 &
          worker_pid=$!

          wait_for_url "$api/health/ready"
          curl --fail --silent --show-error "$api/health/live" >/dev/null
          kill -0 "$worker_pid"

          # Existing privileged path remains healthy.
          admin_match=$(curl --fail --silent --show-error \
            -X POST "$api/v1/matches" \
            -H 'content-type: application/json' \
            -H "x-onbae-admin-key: ${ADMIN_API_KEY}" \
            --data '{"actorAId":"act_nova","actorBId":"act_echo","environmentId":"env_triad_v1"}')
          admin_match_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$admin_match")
          poll_match "$admin_match_id"

          # Create a human principal. Sign-up deliberately does not auto-sign-in.
          curl --fail-with-body --silent --show-error \
            -X POST "$api/api/auth/sign-up/email" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"name":"Smoke Owner","email":"smoke-owner@onbae.test","password":"SmokeOwner-2026-Strong"}' >/tmp/signup-owner.json

          curl --fail-with-body --silent --show-error \
            -c "$owner_cookies" \
            -b "$owner_cookies" \
            -X POST "$api/api/auth/sign-in/email" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"email":"smoke-owner@onbae.test","password":"SmokeOwner-2026-Strong","rememberMe":true}' >/tmp/signin-owner.json

          me_json=$(curl --fail --silent --show-error -b "$owner_cookies" "$api/v1/me")
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["authenticated"] is True; assert d["user"]["email"] == "smoke-owner@onbae.test"' <<<"$me_json"

          # The signed-in human creates two actors; ownership is derived from session, never request body.
          alpha_json=$(curl --fail-with-body --silent --show-error \
            -b "$owner_cookies" \
            -X POST "$api/v1/actors" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"handle":"smoke-alpha","displayName":"Smoke Alpha","description":"CI-owned persistent actor","actorType":"user","provider":"mock","model":"nova-seed-v1","runtime":"onbae-worker"}')
          alpha_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$alpha_json")

          beta_json=$(curl --fail-with-body --silent --show-error \
            -b "$owner_cookies" \
            -X POST "$api/v1/actors" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"handle":"smoke-beta","displayName":"Smoke Beta","description":"CI-owned persistent actor","actorType":"user","provider":"mock","model":"echo-seed-v1","runtime":"onbae-worker"}')
          beta_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$beta_json")

          owned_json=$(curl --fail --silent --show-error -b "$owner_cookies" "$api/v1/me/actors")
          python3 -c 'import json,sys; d=json.load(sys.stdin); handles={a["handle"] for a in d}; assert {"smoke-alpha","smoke-beta"}.issubset(handles)' <<<"$owned_json"

          # Change Alpha's model without changing its actor identity.
          migration_json=$(curl --fail-with-body --silent --show-error \
            -b "$owner_cookies" \
            -X POST "$api/v1/actors/${alpha_id}/migrate" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"provider":"mock","model":"echo-seed-v1","runtime":"onbae-worker","reason":"ci continuity test"}')
          python3 -c 'import json,sys,os; d=json.load(sys.stdin); assert d["actorId"] == os.environ["ALPHA_ID"]' <<<"$migration_json" ALPHA_ID="$alpha_id"

          alpha_profile=$(curl --fail --silent --show-error "$api/v1/actors/smoke-alpha")
          ALPHA_ID="$alpha_id" python3 -c 'import json,sys,os; d=json.load(sys.stdin); assert d["id"] == os.environ["ALPHA_ID"]; assert d["executions"][0]["model"] == "echo-seed-v1"; assert any(e["type"] == "actor.execution.migrated" for e in d["events"])' <<<"$alpha_profile"

          # A second principal must not be able to mutate Alpha.
          curl --fail-with-body --silent --show-error \
            -X POST "$api/api/auth/sign-up/email" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"name":"Smoke Stranger","email":"smoke-stranger@onbae.test","password":"SmokeStranger-2026-Strong"}' >/tmp/signup-stranger.json
          curl --fail-with-body --silent --show-error \
            -c "$stranger_cookies" \
            -b "$stranger_cookies" \
            -X POST "$api/api/auth/sign-in/email" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"email":"smoke-stranger@onbae.test","password":"SmokeStranger-2026-Strong","rememberMe":true}' >/tmp/signin-stranger.json

          forbidden_status=$(curl --silent --show-error \
            -o /tmp/forbidden.json \
            -w '%{http_code}' \
            -b "$stranger_cookies" \
            -X POST "$api/v1/actors/${alpha_id}/migrate" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data '{"provider":"mock","model":"nova-seed-v1","runtime":"onbae-worker"}')
          test "$forbidden_status" = "403"

          # Owner schedules a real worker-backed match. The canonical result must attach to the same actor.
          match_json=$(curl --fail-with-body --silent --show-error \
            -b "$owner_cookies" \
            -X POST "$api/v1/matches" \
            -H "origin: ${origin}" \
            -H 'content-type: application/json' \
            --data "{\"actorAId\":\"${alpha_id}\",\"actorBId\":\"${beta_id}\",\"environmentId\":\"env_triad_v1\"}")
          match_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$match_json")
          poll_match "$match_id"

          alpha_after_match=$(curl --fail --silent --show-error "$api/v1/actors/smoke-alpha")
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(e["type"] == "competition.result" for e in d["events"])' <<<"$alpha_after_match"

          NODE_ENV=production pnpm --filter @onbae/web start >"$web_log" 2>&1 &
          web_pid=$!
          wait_for_url http://localhost:3000/
          curl --fail --silent --show-error http://localhost:3000/matches >/dev/null
          curl --fail --silent --show-error http://localhost:3000/account >/dev/null

          echo "Onbae frozen install, authentication, ownership, model migration, match, canonical event, and web smoke tests passed."
