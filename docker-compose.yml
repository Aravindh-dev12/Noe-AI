services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onbae
      POSTGRES_PASSWORD: onbae
      POSTGRES_DB: onbae
    ports:
      - '5432:5432'
    volumes:
      - onbae-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onbae -d onbae']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - onbae-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onbae-postgres:
  onbae-redis:
